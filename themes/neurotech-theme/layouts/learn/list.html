{{ define "main" }}
<section class="section" style="padding: var(--spacing-lg) 0">
  <div class="container">
    <div style="max-width: 760px; margin: 0 auto 2.5rem; text-align: center">
      <p style="color: var(--text-secondary); font-size: 1.05rem; line-height: 1.6">
        {{ .Content }}
      </p>
    </div>

    <div class="learn-grid">
      {{ range .Site.Data.learn.resources }}
      <a class="learn-card" href="{{ .url | relURL }}">
        {{ with .image }}
        <div class="learn-card-image">
          <img src="{{ . | relURL }}" alt="{{ $.title }}" loading="lazy" />
        </div>
        {{ end }}
        <div class="learn-card-body">
          <h3 class="learn-card-title">{{ .title }}</h3>
          <p class="learn-card-summary">{{ .summary }}</p>
          {{ with .meta }}
          <p class="learn-card-meta">{{ . }}</p>
          {{ end }}
        </div>
        <div class="learn-card-arrow" aria-hidden="true">&rarr;</div>
      </a>
      {{ end }}
    </div>
  </div>
</section>

<style>
  .learn-grid {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    max-width: 920px;
    margin: 0 auto;
  }
  .learn-card {
    display: flex;
    align-items: stretch;
    gap: 1.5rem;
    padding: 1.25rem 1.5rem;
    border-radius: 0.75rem;
    background: var(--color-bg-elevated, rgba(255, 255, 255, 0.04));
    border: 1px solid var(--color-border, rgba(255, 255, 255, 0.08));
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .learn-card:hover {
    transform: translateY(-2px);
    border-color: var(--color-accent, #6ea8ff);
    background: var(--color-bg-hover, rgba(255, 255, 255, 0.06));
  }
  .learn-card-image {
    flex: 0 0 180px;
    border-radius: 0.5rem;
    overflow: hidden;
    align-self: center;
  }
  .learn-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .learn-card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .learn-card-title {
    margin: 0 0 0.4rem;
    font-size: 1.15rem;
    color: var(--text-primary, #fff);
  }
  .learn-card-summary {
    margin: 0;
    color: var(--text-secondary, #c8c8c8);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .learn-card-meta {
    margin: 0.6rem 0 0;
    color: var(--color-gray, #888);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .learn-card-arrow {
    align-self: center;
    font-size: 1.4rem;
    color: var(--color-accent, #6ea8ff);
    flex: 0 0 auto;
  }
  @media (max-width: 640px) {
    .learn-card {
      flex-direction: column;
      gap: 1rem;
    }
    .learn-card-image {
      flex: 0 0 auto;
      width: 100%;
      max-height: 180px;
    }
    .learn-card-arrow {
      align-self: flex-end;
    }
  }
</style>
{{ end }}
